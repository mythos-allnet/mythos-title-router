<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Mythos Title Router</title>
<link rel="stylesheet" href="index_files/fonts.css" type="text/css">
<link rel="stylesheet" href="index_files/bootstrap.min.css" type="text/css">
<link rel="stylesheet" href="index_files/style.css" type="text/css">
</head>
<body>
	<div class="container mx-auto py-3">
		<h1 class="title">Mythos Title Router</h1>
		<p>Looks like your router is working correctly?</p>
		<section>
			<form action="/cgi-bin/mythos/" autocomplete="off" id="config-form" method="post">
				<input type="hidden" name="cmd" value="vpn_set">
				<div class="row mb-0">
					<div class="col-lg-6">
						<div class="card bg-light mb-3">
							<h5 class="card-header">VPN</h5>
							<div class="card-body">
								<div class="mb-3">
									<label class="form-label" for="network">Network</label>
									<select class="form-select" id="network" name="network">
										<option value="evoker">Evoker</option>
										<option selected="selected" value="mythos">Mythos</option>
									</select>
								</div>
								<div class="mb-3">
									<label class="form-label" for="vpn-private-key">Private Key</label>
									<input class="form-control" id="vpn-private-key" name="vpn-private-key" type="text" required="required" pattern="^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$">
									<div class="form-text">Base64-encoded private key for the VPN interface.</div>
								</div>
								<div class="mb-0">
									<label class="form-label" for="vpn-ip-address-suffix">IP Address</label>
									<div class="input-group">
										<div class="input-group-text" id="vpn-ip-address-prefix">172.18.</div>
										<input class="form-control" id="vpn-ip-address-octet-3" name="vpn-ip-address-octet-3" type="number" min="0" max="255" value="1" required="required">
										<div class="input-group-text">.</div>
										<input class="form-control" id="vpn-ip-address-octet-4" name="vpn-ip-address-octet-4" type="number" min="0" max="255" value="2" required="required">
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-6">
						<div class="card bg-light">
							<h5 class="card-header">LAN</h5>
							<div class="card-body">
								<div class="mb-2">
									<label class="form-label" for="lan-game-type">Application Name</label>
									<select class="form-select" id="lan-game-type" name="lan-ip-address-subnet">
										<option value="69">House of the Dead: Scarlet Dawn</option>
										<option value="126">Wonderland Wars</option>
										<option selected="selected" value="139">Chunithm</option>
										<option value="144">Kancolle Arcade</option>
										<option value="149">Mario & Sonic</option>
										<option value="155">Chrono Regalia</option>
										<option value="158">Initial D Arcade Stage Zero</option>
										<option value="160">SEGA World Drivers Championship</option>
										<option value="162">Ongeki</option>
										<option value="165">Card Maker</option>
										<option value="167">Fate/Grand Order Arcade</option>
										<option value="168">ALL.Net P-ras MULTI Version 3</option>
										<option value="172">maimai DX</option>
										<option value="174">WACCA</option>
										<option value="175">StarHorse 4</option>
										<option hidden="hidden" value="router-kit">SEGA Router Kit</option>
										<option value="custom">Custom</option>
									</select>
								</div>
								<div class="form-check" id="using-sega-router-kit-section">
									<input class="form-check-input" type="checkbox" value="" id="using-sega-router-kit">
									<label class="form-check-label" for="using-sega-router-kit">
										Do you plan on using the built-in SEGA router kit?
										<div class="form-text mt-0">If you do not know what this is, then do not check this.</div>
									</label>
								</div>
								<div class="d-none mb-0 mt-3" id="lan-ip-address-subnet-section">
									<label class="form-label" for="lan-ip-address-subnet-custom">Custom IP Address Subnet</label>
									<div class="input-group">
										<span class="input-group-text">192.168.</span>
										<input class="form-control" id="lan-ip-address-subnet-custom" name="lan-ip-address-subnet-custom" type="number" min="2" max="254" value="139" required="required">
										<span class="input-group-text">.0</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<p class="text-center">Have questions? Reach out on the Mythos Discord!</p>
				<div class="control-group">
					<a class="btn btn-secondary" href="/cgi-bin/luci/">Advanced Settings (LuCI)</a>
					<input class="btn btn-primary float-end" id="submit" type="submit" value="Save & Apply">
				</div>
				<hr>
			</form>
		</section>
		<section>
			<div class="d-none" id="network-status">
				<h5>Network Status</h5>
				<pre id="network-status-text"><code></code></pre>
			</div>
			<div class="d-none" id="save-output">
				<h5>Save Output</h5>
				<pre id="save-output-text"><code></code></pre>
			</div>
		</section>
	</div>

	<script src="index_files/main.js" type="application/javascript"></script>
</body>
</html>
